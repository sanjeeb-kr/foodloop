{% extends "base.html" %}

{% block title %}Page Not Found (404) — FoodLoop{% endblock %}

{% block content %}
<div class="container" style="max-width: 550px; text-align: center; padding: 60px 20px;">
  <div style="font-size: 4.5rem; font-weight: 800; color: var(--primary-color); line-height: 1;">404</div>
  <h1 style="font-size: 1.8rem; margin: 16px 0 10px 0;">Donation Listing Not Found</h1>
  <p style="color: var(--text-muted); margin-bottom: 24px;">
    The page or food listing you requested might have expired, been removed, or is temporarily unavailable.
  </p>
  <a href="{{ url_for('discover_donations') }}" class="btn btn-primary">Browse Available Food</a>
  <a href="{{ url_for('index') }}" class="btn btn-outline" style="margin-left: 10px;">Return Home</a>
</div>
{% endblock %}
